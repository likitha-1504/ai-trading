name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Code Formatting & Lint Check
        run: |
          ruff check backend/

      - name: Mypy Static Type Analysis
        run: |
          mypy backend/app

      - name: Run Pytest Regression Suite
        run: |
          pytest -v

      - name: Run Operational Preflight Audit
        run: |
          python backend/scripts/preflight_check.py

      - name: Secret Scan Verification
        run: |
          # Verify no secrets, credentials, or databases are committed
          if git ls-files | grep -E '\.env$|\.key$|credentials\.json|\.db$|backups/.*\.db$'; then
            echo "SECURITY ERROR: Forbidden sensitive file found in Git repository!"
            exit 1
          fi
          echo "Secret scan passed: zero sensitive files committed."

  frontend-checks:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          npm ci

      - name: TypeScript Compilation & Production Build
        run: |
          npm run build
